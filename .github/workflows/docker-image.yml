name: Build and push Docker Image

on:
  push:
    paths:
      - 'Sources/**'
      - '.github/workflows/docker-image.yaml'
    branches:
      - main
  workflow_dispatch:

jobs:
  push_to_registry:
    name: push docker image to hub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: check repository
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Determine version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v4.7.0

      - name: login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: Sources
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spamai:latest
            ghcr.io/${{ github.repository_owner }}/spamai:${{ steps.gitversion.outputs.MajorMinorPatch }}
          file: Sources/Dockerfile

      - name: Record published version
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_TAG: ${{ steps.gitversion.outputs.MajorMinorPatch }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
